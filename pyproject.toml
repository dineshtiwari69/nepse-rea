[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nepse-api"
version = "0.1.0"
description = "Unofficial, typed Python client for the public NEPSE (Nepal Stock Exchange) website API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nepse-api contributors" }]
keywords = ["nepse", "nepal", "stock", "market", "api"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nepse = "nepseapi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nepseapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
